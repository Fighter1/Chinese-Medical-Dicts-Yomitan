name: Build dictionaries

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Where the pinned source MDX/MDD release lives. Override with a repository
      # variable (and SOURCE_INPUTS_TOKEN secret) to keep the sources in a private repo.
      SOURCE_REPO: ${{ vars.SOURCE_REPO || github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install converter
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest

      - name: Fetch pinned source inputs
        env:
          GH_TOKEN: ${{ secrets.SOURCE_INPUTS_TOKEN || github.token }}
        run: python .github/scripts/fetch_inputs.py --repo "$SOURCE_REPO"

      - name: Choose revision
        id: revision
        # YYYY.MM.DD.<run number>: four dot-separated integers, so Yomitan's
        # numeric revision comparison sees every later run as newer.
        run: echo "value=$(date -u +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          MEDICAL_YOMITAN_REVISION: ${{ steps.revision.outputs.value }}
        run: |
          python -m medical_yomitan build --input input/xiandai-yixue-cidian
          python -m medical_yomitan build --input input/xinbian-shiyong-yixue-cidian

      - name: Validate
        run: |
          python -m medical_yomitan validate dist/xiandai-yixue-cidian-yomitan.zip
          python -m medical_yomitan validate dist/xinbian-shiyong-yixue-cidian-yomitan.zip

      - name: Archive checks
        run: python -m pytest tests/test_builder.py

      - name: Prepare release assets
        id: prepare
        run: python .github/scripts/prepare_release.py --dist dist --output release | tee -a "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: medical-yomitan-${{ github.sha }}
          path: release/
          retention-days: 7

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_id }}-${{ github.run_attempt }}"
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Medical dictionaries build ${{ steps.prepare.outputs.revision }}" \
            --notes-file release/NOTES.md \
            --latest \
            release/*.zip release/index-*.json release/*-conversion-report.json release/SHA256SUMS.txt
